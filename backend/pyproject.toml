[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136",
    "langchain>=1.3",
    "langchain-chroma>=1.1",
    "langchain-community>=0.4",
    "langchain-deepseek>=1.1.0",
    "langchain-huggingface>=1.2",
    "langchain-openai>=1.2",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=2.1",
    "modelscope>=1.38.1",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.5",
    "ragas>=0.2",
    "rank-bm25>=0.2.2",
    "redis>=8.0",
    "sentence-transformers>=5.5",
    "tortoise-orm[asyncpg]>=0.24",
    "tzdata==2026.2",
]

[tool.pytest.ini_options]
# 只收集分层测试目录，避免把 test/ 下的手跑 E2E 脚本当用例收集
testpaths = ["tests"]
asyncio_mode = "auto"
# 把 rootdir（backend/）加入 sys.path，保证 `import app.*` 在任意平台/CI 生效
pythonpath = ["."]
# 覆盖率：只统计业务代码 app/，列出未覆盖行（本地与 CI 一致）
addopts = "--cov=app --cov-report=term-missing"

[tool.ruff]
target-version = "py314"
include = ["app/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
# CI 第一道闸门（ci.yml 在 pytest 之前执行）：pycodestyle 关键子集 + pyflakes + bugbear
# 有意不选 I（import 排序）与 E501（行宽）——历史代码量大，收益低噪音高；
# 随手修而非配置豁免是原则
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends() 写在参数默认值是 FastAPI 官方依赖注入模式，非真 bug（B008 误报）
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# E402：两处导入顺序是有意设计——
#   main.py: Windows 事件循环策略补丁必须先于框架导入执行；
#   usage_tracker.py: 环境变量注入必须先于 LangChain 导入
"app/main.py" = ["E402"]
"app/llm/usage_tracker.py" = ["E402"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7",
    "ruff>=0.14",
]
