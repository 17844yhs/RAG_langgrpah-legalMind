server {
    listen 80;

    # 前端 SPA 路由：全部回退到 index.html，交给 Vue Router 接管
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理（容器网络内用服务名访问，跨域问题就此消失）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE 关键配置：关闭缓冲，否则流式输出会被 nginx 攒成一坨一次性吐出
        proxy_buffering off;
        proxy_cache off;
        # SSE 长连接（HITL 追问可能停很久），读超时要给足
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
    }

    # API 文档与健康检查透传
    location /docs { proxy_pass http://backend:8000; }
    location /openapi.json { proxy_pass http://backend:8000; }
    location /health { proxy_pass http://backend:8000; }
}
